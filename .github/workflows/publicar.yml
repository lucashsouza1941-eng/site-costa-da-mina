# Publica o site no GitHub Pages (endereço temporário) a cada push na main.
# Em pull requests para a main, roda os mesmos testes e o build, sem publicar.
# O domínio institutocostadamina.com.br só será conectado após a aprovação final.
name: Publicar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # cada PR tem a sua fila; a publicação (push na main) tem outra
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'pages' }}
  cancel-in-progress: true

jobs:
  testes:
    name: Tipos, testes e fluxo de cursos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Banco, regras, conteúdo e acervo
        run: npm test
      - name: Módulo de cursos no navegador (Supabase falso)
        run: npm run e2e:cursos

  build:
    name: Build e testes do site gerado
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - name: Build (exportação estática)
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Módulo de cursos: só valores públicos (Settings → Variables).
          # A chave de serviço do Supabase NUNCA entra aqui.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
      - name: Verificar o site gerado
        run: node --test tests/build/*.test.mjs
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Navegador (páginas, teclado, acessibilidade, larguras)
        run: npm run e2e
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
